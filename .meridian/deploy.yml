---
service: packs_iyi_dev
image: ghcr.io/domify/iyipacks-website:latest
servers:
  web:
    hosts:
      - condeploy
    proxy:
      host: packs.iyi.dev
      redirect_hosts:
        - iyipacks.mx.ee
      ssl: true
      app_port: 8080
      healthcheck:
        path: /health
ssh:
  user: deploy
transfer:
  mode: incremental
hooks:
  pre_deploy: make image
