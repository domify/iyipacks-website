# TOML migration candidate. The server still reads catalog.yml until
# the Crystal shard has been downloaded, bound, and tested.

[[categories]]
slug = "web"
name = "Web & networking"
description = "HTTP, sockets and web frameworks."
icon = "↗"

[[categories]]
slug = "data"
name = "Data & serialization"
description = "Read, write and exchange structured data."
icon = "{}"

[[categories]]
slug = "text"
name = "Text & markup"
description = "Templates, formatting and safe HTML."
icon = "Aa"

[[categories]]
slug = "system"
name = "System & tooling"
description = "Files, processes and command-line tools."
icon = ">_"

[[categories]]
slug = "utilities"
name = "Utilities"
description = "Time, identifiers and everyday building blocks."
icon = "◷"

[[packages]]
slug = "http"
name = "HTTP"
category = "web"
description = "An HTTP/1.1 client and fiber-based server built on iyi sockets."
kind = "Native iyi"
source = "https://github.com/iyilang/iyi/blob/master/src/std/http.iyi"
usage = "import std/http::{Server, Response}"
note = "HTTP only; no TLS in the native client."
license = "Apache-2.0"
distribution = "Standard library"

[[packages]]
slug = "socket"
name = "Sockets"
category = "web"
description = "TCP and Unix sockets with cooperative, cancellable I/O."
kind = "Native iyi"
source = "https://github.com/iyilang/iyi/blob/master/src/std/socket.iyi"
usage = "import std/socket::{IyiSocket}"
note = "Native runtime socket support."
license = "Apache-2.0"
distribution = "Standard library"

[[packages]]
slug = "json"
name = "JSON"
category = "data"
description = "Parse and generate JSON with typed values and streaming APIs."
kind = "Native iyi"
source = "https://github.com/iyilang/iyi/blob/master/src/std/json.iyi"
usage = "import std/json::{JSON}"
note = "Parser, builder and serialization helpers."
license = "Apache-2.0"
distribution = "Standard library"

[[packages]]
slug = "yaml"
name = "YAML"
category = "data"
description = "Read and write YAML configuration and structured documents."
kind = "Native iyi"
source = "https://github.com/iyilang/iyi/blob/master/src/std/yaml.iyi"
usage = "import std/yaml::{YAML}"
note = "Check the module interface for supported YAML features."
license = "Apache-2.0"
distribution = "Standard library"

[[packages]]
slug = "csv"
