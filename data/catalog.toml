# The hand-written part of the catalog: categories, the iyi standard library,
# and [[modules]] for iyi modules on GitHub. `make update` finds those
# modules and writes their data to data/modules.toml. A [[modules]] entry
# names a repository it should always look at, and every other key in it
# replaces the imported one, such as `category` or `description`;
# `hidden = "true"` leaves the module out of the site.

[[categories]]
slug = "web"
name = "Web & networking"
description = "HTTP, sockets and web frameworks."
icon = "↗"

[[categories]]
slug = "data"
name = "Data & serialization"
description = "Read, write and exchange structured data."
icon = "{}"

[[categories]]
slug = "text"
name = "Text & markup"
description = "Templates, formatting and safe HTML."
icon = "Aa"

[[categories]]
slug = "system"
name = "System & tooling"
description = "Files, processes and command-line tools."
icon = ">_"

[[categories]]
slug = "utilities"
name = "Utilities"
description = "Time, identifiers and everyday building blocks."
icon = "◷"

[[categories]]
slug = "other"
name = "Other"
description = "Modules that fit no other category yet."
icon = "…"

[[packages]]
slug = "http"
name = "HTTP"
category = "web"
description = "An HTTP/1.1 client and fiber-based server built on iyi sockets."
source = "https://github.com/iyilang/iyi/blob/master/src/std/http.iyi"
usage = "import std/http::{Server, Response}"
note = "HTTP only; no TLS in the native client."
license = "Apache-2.0"
distribution = "Standard library"

[[packages]]
slug = "socket"
name = "Sockets"
category = "web"
description = "TCP and Unix sockets with cooperative, cancellable I/O."
source = "https://github.com/iyilang/iyi/blob/master/src/std/socket.iyi"
usage = "import std/socket::{IyiSocket}"
note = "Native runtime socket support."
license = "Apache-2.0"
distribution = "Standard library"

