[[packages]]
slug = "kemal"
name = "Kemal"
category = "web"
description = "A lightweight web framework with a familiar route-based API."
kind = "Crystal compatible"
source = "https://github.com/kemalcr/kemal"
usage = '''
require "kemal"
# Build with: iyi build --crystal src/server.iyi'''
note = "iyi includes a Crystal compatibility example for Kemal."
license = "See repository"
distribution = "Crystal shard"

